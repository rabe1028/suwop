[package]
name = "suwop-local-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
suwop-core = { path = "../suwop-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rusqlite = { version = "=0.40.1", features = ["bundled"] }
lancedb = { version = "=0.37.1", default-features = false }
arrow-array = "58"
arrow-schema = "58"
futures = "0.3"
