[workspace]
members = ["crates/suwop-core", "crates/suwop-ffi", "crates/suwop-local-store"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
crux_core = "=0.20.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = { version = "0.11", default-features = false }
base64 = "0.22"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
strip = "debuginfo"
