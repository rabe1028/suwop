name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '2'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Isolate Rust toolchains from the runner image
        run: |
          suwop_rustup_dir="$(mktemp -d "$RUNNER_TEMP/suwop-rustup.XXXXXX")"
          echo "RUSTUP_HOME=$suwop_rustup_dir" >> "$GITHUB_ENV"
          RUSTUP_HOME="$suwop_rustup_dir" rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Install pinned quality tools
        run: bash scripts/install-tools.sh
      - name: Enforce Rust, script, workflow and architecture rules
        run: make lint-common
      - run: make test
      - name: Test release without retaining the completed debug build
        run: |
          cargo clean
          cargo test --locked --workspace --all-features --release

  immich-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run Rust core against Immich v3.2.4 in Docker
        env:
          IMMICH_VERSION: v3.2.4
        run: make integration

  apple-rust:
    name: apple-rust (${{ matrix.target }})
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          - x86_64-apple-ios
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Isolate the pinned Rust toolchain
        run: |
          suwop_rustup_dir="$(mktemp -d "$RUNNER_TEMP/suwop-slice-rustup.XXXXXX")"
          echo "RUSTUP_HOME=$suwop_rustup_dir" >> "$GITHUB_ENV"
          RUSTUP_HOME="$suwop_rustup_dir" rustup toolchain install 1.95.0 --profile minimal
      - name: Install protobuf compiler
        run: brew install protobuf
      - name: Build one release slice
        env:
          APPLE_TARGET: ${{ matrix.target }}
        run: bash scripts/build-rust-apple.sh --slice "$APPLE_TARGET"
      - name: Retain the revision-bound release slice
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-slice-${{ matrix.target }}
          path: Generated/RustSlices/
          if-no-files-found: error
          retention-days: 1

  apple:
    needs: apple-rust
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Isolate Rust toolchains from the runner image
        run: |
          suwop_rustup_dir="$(mktemp -d "$RUNNER_TEMP/suwop-rustup.XXXXXX")"
          echo "RUSTUP_HOME=$suwop_rustup_dir" >> "$GITHUB_ENV"
          RUSTUP_HOME="$suwop_rustup_dir" rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Install pinned quality tools
        run: bash scripts/install-tools.sh
      - name: Enforce Swift formatting and strict lint
        run: make lint-swift
      - name: Test the real Rust-to-Swift bridge
        run: make test
      - name: Download this run's five release slices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: rust-slice-*
          path: Generated/RustSlices
          merge-multiple: true
      - name: Build universal Rust libraries, iOS and macOS apps
        run: |
          cargo clean
          # Swift tests have finished; Xcode uses the shared SourcePackages cache below.
          rm -rf .build
          SUWOP_CLEAN_CHECK=1 make apple-build APPLE_RUST_BUILD_ARGS=--package
      - name: Verify native sharing source invalidation and selected-service leases
        run: make sharing-test

  vrt:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Isolate the pinned Rust toolchain
        run: |
          suwop_rustup_dir="$(mktemp -d "$RUNNER_TEMP/suwop-vrt-rustup.XXXXXX")"
          echo "RUSTUP_HOME=$suwop_rustup_dir" >> "$GITHUB_ENV"
          RUSTUP_HOME="$suwop_rustup_dir" rustup toolchain install 1.95.0 --profile minimal
      - name: Install XcodeGen and pinned SimSlim
        run: |
          brew install xcodegen protobuf
          make setup-vrt
      - name: Compare native SwiftUI screenshots on one slim Simulator
        run: make vrt
      - name: Verify real PhotoKit edits, restart, lost-response reconciliation and reversion
        run: |
          # Keep VRTArtifacts (screenshots/results); reclaim only completed build products.
          rm -rf DerivedData/VRT/Build
          make apple-native-test
      - name: Preserve screenshots, pixel diffs, timing, profile and native test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vrt-${{ github.sha }}
          path: |
            DerivedData/VRTArtifacts/
            DerivedData/PhotoKitArtifacts/
          if-no-files-found: warn
          retention-days: 14
