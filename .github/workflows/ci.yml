name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '2'
  NEXTEST_PROFILE: ci

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, debug tests and release tests run on separate runners with separate
  # caches, so no job compiles the workspace twice or discards its build.
  lint:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.24'
          enable-cache: true
      - name: Isolate Rust toolchains from the runner image
        run: |
          suwop_rustup_dir="$RUNNER_TEMP/suwop-rustup"
          echo "RUSTUP_HOME=$suwop_rustup_dir" >> "$GITHUB_ENV"
          RUSTUP_HOME="$suwop_rustup_dir" rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Cache Rust dependencies and target builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # RUSTUP_HOME is hashed by rust-cache; keep its isolated path stable.
          key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
          env-vars: DEVELOPER_DIR SDKROOT
          # Only main saves: per-PR caches exceeded the 10 GB repository limit and
          # evicted main's caches, so every PR started cold.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned quality tools
        run: bash scripts/install-tools.sh
      - name: Enforce Rust, script, workflow and architecture rules
        run: make lint-common

  core:
    name: core (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            target: test
            args: ''
          - profile: release
            target: test-rust
            args: --release
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.24'
          enable-cache: true
      - name: Isolate Rust toolchains from the runner image
        run: |
          suwop_rustup_dir="$RUNNER_TEMP/suwop-rustup"
          echo "RUSTUP_HOME=$suwop_rustup_dir" >> "$GITHUB_ENV"
          RUSTUP_HOME="$suwop_rustup_dir" rustup toolchain install 1.95.0 --profile minimal
      - name: Cache Rust dependencies and target builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # RUSTUP_HOME is hashed by rust-cache; keep its isolated path stable.
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.profile }}
          cache-bin: false
          env-vars: DEVELOPER_DIR SDKROOT
          # Only main saves: per-PR caches exceeded the 10 GB repository limit and
          # evicted main's caches, so every PR started cold.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned quality tools
        run: bash scripts/install-tools.sh
      - name: Run the ${{ matrix.profile }} test suite
        env:
          TARGET: ${{ matrix.target }}
          ARGS: ${{ matrix.args }}
        run: make "$TARGET" RUST_TEST_ARGS="$ARGS"

  immich-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.24'
          enable-cache: true
      - name: Isolate the pinned Rust toolchain
        run: |
          suwop_rustup_dir="$RUNNER_TEMP/suwop-rustup"
          echo "RUSTUP_HOME=$suwop_rustup_dir" >> "$GITHUB_ENV"
          RUSTUP_HOME="$suwop_rustup_dir" rustup toolchain install 1.95.0 --profile minimal
      - name: Cache Rust dependencies and target builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # RUSTUP_HOME is hashed by rust-cache; keep its isolated path stable.
          key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
          env-vars: DEVELOPER_DIR SDKROOT
          # Only main saves: per-PR caches exceeded the 10 GB repository limit and
          # evicted main's caches, so every PR started cold.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify old-server ordinary, read, recovery and denied PIN writes
        env:
          IMMICH_VERSION: v3.2.4
          IMMICH_TEST_PROJECT: suwop-ci-324
          SUWOP_NATIVE_LIVE_EVIDENCE_DIR: ${{ runner.temp }}/suwop-integration-324
        run: make integration
      - name: Verify exact stable 3.3.3 PIN write contract and native graph preservation
        env:
          IMMICH_VERSION: v3.3.3
          IMMICH_TEST_PROJECT: suwop-ci-333
          SUWOP_NATIVE_LIVE_EVIDENCE_DIR: ${{ runner.temp }}/suwop-integration-333
        run: make integration
      - name: Preserve safe per-release integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: immich-integration-${{ github.sha }}
          path: ${{ runner.temp }}/suwop-integration-*
          if-no-files-found: warn
          retention-days: 14

  # macOS runs only what needs Apple SDKs, Xcode or simulators. Each kind of
  # build happens once, with one main-only cache, and is shared by artifacts.
  # Rust tests and repository checks already run on Linux.
  apple:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.24'
          enable-cache: true
      - name: Isolate the pinned Rust toolchain
        run: |
          suwop_rustup_dir="$RUNNER_TEMP/suwop-rustup"
          echo "RUSTUP_HOME=$suwop_rustup_dir" >> "$GITHUB_ENV"
          RUSTUP_HOME="$suwop_rustup_dir" rustup toolchain install 1.95.0 --profile minimal
      - name: Cache Rust host and release Apple builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # RUSTUP_HOME is hashed by rust-cache; keep its isolated path stable.
          key: ${{ runner.os }}-${{ runner.arch }}-apple
          cache-bin: false
          env-vars: DEVELOPER_DIR SDKROOT
          # Only main saves: per-PR caches exceeded the 10 GB repository limit and
          # evicted main's caches, so every PR started cold.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned quality tools
        run: bash scripts/install-tools.sh
      # Linux SwiftLint skips the SourceKit-backed custom rules, so lint stays here.
      - name: Enforce Swift formatting and strict lint
        run: make lint-swift
      - uses: ./.github/actions/cache-apple-packages
      - name: Test the real Rust-to-Swift bridge
        run: make test-swift
      - name: Build ARM64 Rust release slices, iOS and macOS apps
        run: make apple-build
      - name: Verify native sharing source invalidation and selected-service leases
        run: make sharing-test
      - name: Verify private VIDEO playback and exact owner cleanup on macOS
        run: make private-video-mac-test
      - name: Verify protected Live playback and exact owner cleanup on macOS
        run: make private-live-mac-test
      - name: Preserve protected Live macOS playback evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: private-live-macos-${{ github.sha }}
          path: DerivedData/PrivateLiveMac/TestResults/
          if-no-files-found: warn
          retention-days: 14

  # Builds the VRT and PhotoKit test products once for every simulator lane.
  apple-products:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.24'
          enable-cache: true
      - name: Isolate the pinned Rust toolchain
        run: |
          suwop_rustup_dir="$RUNNER_TEMP/suwop-rustup"
          echo "RUSTUP_HOME=$suwop_rustup_dir" >> "$GITHUB_ENV"
          RUSTUP_HOME="$suwop_rustup_dir" rustup toolchain install 1.95.0 --profile minimal
      - name: Cache the Rust simulator build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # RUSTUP_HOME is hashed by rust-cache; keep its isolated path stable.
          key: ${{ runner.os }}-${{ runner.arch }}-simulator
          cache-bin: false
          env-vars: DEVELOPER_DIR SDKROOT
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install XcodeGen
        run: brew install xcodegen protobuf
      - uses: ./.github/actions/cache-apple-packages
      - name: Build simulator test products
        run: make simulator-products
      # upload-artifact drops file modes; a tarball keeps executables and bundle symlinks.
      - name: Pack simulator test products
        run: tar -czf "$RUNNER_TEMP/simulator-products.tgz" -C DerivedData/SimulatorProducts/current .
      - name: Retain this attempt's simulator test products
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: simulator-products-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simulator-products.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  simulator:
    needs: apple-products
    runs-on: macos-26
    name: simulator (${{ matrix.suite }})
    # Lanes only run prebuilt products. The host lane runs PhotoKit acceptance after
    # its screenshots, so PhotoKit service changes never precede a comparison.
    strategy:
      fail-fast: false
      matrix:
        suite: [vrt-ci-ui-1, vrt-ci-ui-2, vrt-ci-host]
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      SUWOP_SIMULATOR_PRODUCTS: ${{ github.workspace }}/DerivedData/SimulatorProducts/ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.24'
          enable-cache: true
      - name: Install pinned SimSlim
        run: make setup-vrt
      - name: Download this attempt's simulator test products
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: simulator-products-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Unpack simulator test products
        run: |
          mkdir -p "$SUWOP_SIMULATOR_PRODUCTS"
          tar -xzf "$RUNNER_TEMP/simulator-products.tgz" -C "$SUWOP_SIMULATOR_PRODUCTS"
      - name: Run the selected pinned simulator lane
        id: lane
        env:
          SUITE: ${{ matrix.suite }}
        run: make "$SUITE"
      - name: Verify unchanged PhotoKit acceptance after the screenshots
        if: ${{ matrix.suite == 'vrt-ci-host' && !cancelled() && steps.lane.outcome != 'skipped' }}
        run: make apple-native-test
      - name: Preserve screenshots, pixel diffs, timing, profile and native test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.suite }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            DerivedData/VRTArtifacts/
            DerivedData/PhotoKitArtifacts/
          if-no-files-found: warn
          retention-days: 14

  # Preserve the required check name; skipped/cancelled/failed suites never pass.
  vrt:
    runs-on: ubuntu-latest
    needs: simulator
    if: always()
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.24'
          enable-cache: true
      - name: Require successful screenshot, UI and unchanged PhotoKit gates
        env:
          SIMULATOR_RESULT: ${{ needs.simulator.result }}
        run: test "$SIMULATOR_RESULT" = success
      - name: Read only this run attempt's host and UI shard VRT lane artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: vrt-ci-*-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: DerivedData/VRTLanes
      - name: Validate the complete exact-head VRT union
        env:
          SIMULATOR_RESULT: ${{ needs.simulator.result }}
        run: |
          uv run --no-project python scripts/vrt_lanes.py aggregate \
            DerivedData/VRTLanes "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SIMULATOR_RESULT"
      - name: Preserve complete VRT union receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vrt-union-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: DerivedData/VRTLanes/aggregate.json
          if-no-files-found: warn
