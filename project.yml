name: Suwop
options:
  minimumXcodeGenVersion: 2.38.0
  createIntermediateGroups: true
  # Xcode copies the model folder even when empty; without models, content search is disabled.
  preGenCommand: mkdir -p Generated/CoreMLModels/EmbeddingGemma2
settings:
  base:
    SWIFT_VERSION: '6.0'
    # Supported platforms: Apple Silicon Mac, ARM64 iOS devices and simulators.
    ARCHS: arm64
    # The Rust core builds only the arm64 iOS simulator slice.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  SuwopShell:
    path: .
targets:
  SuwopiOS:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - App
      # Compiled models from `make coreml-models`; builds without them disable content search.
      - path: Generated/CoreMLModels/EmbeddingGemma2
        type: folder
        optional: true
        buildPhase: resources
    dependencies:
      - package: SuwopShell
        product: SuwopShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.rabe1028.suwop.ios
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: Suwop
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSPhotoLibraryUsageDescription: 写真を閲覧・整理し、Apple Photos と Immich の原本を照合・コピー・移動します。
        NSFaceIDUsageDescription: このアプリで保護した写真を表示するために認証します。
        NSPhotoLibraryAddUsageDescription: Immich の写真を Apple Photos に保存します。
        NSLocalNetworkUsageDescription: 自宅ネットワーク上の Immich サーバーに接続します。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  SuwopmacOS:
    type: application
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - App
      # Compiled models from `make coreml-models`; builds without them disable content search.
      - path: Generated/CoreMLModels/EmbeddingGemma2
        type: folder
        optional: true
        buildPhase: resources
    dependencies:
      - package: SuwopShell
        product: SuwopShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.rabe1028.suwop.mac
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_ENTITLEMENTS: Config/Suwop.entitlements
    info:
      path: Generated/macOS-Info.plist
      properties:
        CFBundleDisplayName: Suwop
        LSApplicationCategoryType: public.app-category.photography
        NSPhotoLibraryUsageDescription: 写真を閲覧・整理し、Apple Photos と Immich の原本を照合・コピー・移動します。
        NSPhotoLibraryAddUsageDescription: Immich の写真を Apple Photos に保存します。
        NSLocalNetworkUsageDescription: 自宅ネットワーク上の Immich サーバーに接続します。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  SuwopVRTHost:
    type: application
    platform: iOS
    deploymentTarget: '26.4'
    sources:
      - path: App
        excludes: [SuwopApp.swift]
      - path: VRT/Host
      - path: NativeAcceptance/PrivateLiveTests/PrivateLiveNativeFixture.swift
      - path: NativeAcceptance/PrivateLiveTests/PrivateLiveTestWindow.swift
      - path: Tests/fixtures/private_video/synthetic-private-video.mp4
        buildPhase: resources
      - path: Tests/fixtures/private_video/synthetic-private-video.mov
        buildPhase: resources
      - path: Tests/fixtures/native_live_motion/media/synthetic-still.jpg
        buildPhase: resources
      - path: Tests/fixtures/native_live_motion/media/synthetic-motion.mov
        buildPhase: resources
    dependencies:
      - package: SuwopShell
        product: SuwopShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.rabe1028.suwop.vrt
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) SUWOP_VRT'
        TARGETED_DEVICE_FAMILY: '1'
    info:
      path: Generated/VRT-Info.plist
      properties:
        CFBundleDevelopmentRegion: ja
        NSFaceIDUsageDescription: 検証用の保護された写真を表示するために認証します。
        CFBundleLocalizations: [ja]
        UILaunchScreen: {}
  SuwopVRT:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '26.4'
    sources:
      - path: VRT/Tests
      - path: NativeAcceptance/PrivateLiveTests/PrivateLiveSurfaceTests.swift
    dependencies:
      - target: SuwopVRTHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.rabe1028.suwop.vrt.tests
        SWIFT_OPTIMIZATION_LEVEL: '-O'
  SuwopVRTUI:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '26.4'
    sources: [VRT/UITests]
    dependencies:
      - target: SuwopVRTHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.rabe1028.suwop.vrt.ui
        TEST_TARGET_NAME: SuwopVRTHost
  SuwopPhotoKitHost:
    type: application
    platform: iOS
    deploymentTarget: '26.4'
    sources:
      - path: App
        excludes: [SuwopApp.swift]
      - path: NativeAcceptance/Host
    dependencies:
      - package: SuwopShell
        product: SuwopShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.rabe1028.suwop.photokit.acceptance
        TARGETED_DEVICE_FAMILY: '1'
    info:
      path: Generated/PhotoKitAcceptance-Info.plist
      properties:
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: 専用 Simulator のテスト用写真で保存・復元を検証します。
        NSFaceIDUsageDescription: 検証用の保護された写真を表示するために認証します。
        NSPhotoLibraryAddUsageDescription: 専用 Simulator に検証用の写真を作成します。
  SuwopPhotoKitTests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '26.4'
    sources: [NativeAcceptance/UITests]
    dependencies:
      - target: SuwopPhotoKitHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.rabe1028.suwop.photokit.acceptance.tests
        TEST_TARGET_NAME: SuwopPhotoKitHost
  SuwopAmazonMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '14.0'
    sources: [NativeAcceptance/AmazonMacTests]
    dependencies:
      - target: SuwopmacOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.rabe1028.suwop.amazon.tests
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/SuwopmacOS.app/Contents/MacOS/SuwopmacOS'
        BUNDLE_LOADER: '$(TEST_HOST)'
  SuwopSharingTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - path: App/SystemSharing.swift
      - path: App/ContentPresentationEpoch.swift
      - path: App/MacScenePresentationAnchor.swift
      - path: App/NativeSceneAnchorChanges.swift
      - path: App/ImmichVisibilityPresentation.swift
      - path: App/MacImmichVisibilityConfirmation.swift
      - path: App/MacImmichArchiveConfirmation.swift
      - path: App/ImmichArchivePresentationText.swift
      - path: NativeAcceptance/SharingTests
    dependencies:
      - package: SuwopShell
        product: SuwopShell
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.rabe1028.suwop.sharing.tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) SUWOP_SHARING_TEST'
  SuwopPrivateVideoMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - path: App/ImmichLockedVideoNativeAccess.swift
      - path: App/ImmichLockedVideoQuiescence.swift
      - path: App/ImmichLockedVideoEffects.swift
      - path: App/ImmichLockedVideoPlayer.swift
      - path: App/ImmichLockedVideoSurface.swift
      - path: App/PrivateVideoAcquisition.swift
      - path: App/PrivateMediaAcquisition.swift
      - path: App/PrivateMediaConsumerRegistry.swift
      - path: App/PrivateVideoBinding.swift
      - path: App/PrivateVideoAllocation.swift
      - path: App/PrivateMediaAllocationTypes.swift
      - path: App/PrivateMediaAllocationLedger.swift
      - path: App/PrivateVideoFiles.swift
      - path: App/PrivateVideoNamespace.swift
      - path: App/PrivateVideoVolume.swift
      - path: App/PrivateVideoDownload.swift
      - path: App/PrivateVideoResponse.swift
      - path: App/NativeSubmissionGate.swift
      - path: App/MacScenePresentationAnchor.swift
      - path: App/NativeSceneAnchorChanges.swift
      - path: VRT/Host/PrivateVideoHTTPServer.swift
      - path: VRT/Host/ImmichVisibilityFixtureServer.swift
      - path: VRT/Host/ImmichVisibilityFixtureData.swift
      - path: VRT/Host/ImmichLockedFixtureData.swift
      - path: NativeAcceptance/PrivateVideoMacTests
      - path: Tests/fixtures/private_video/synthetic-private-video.mp4
        buildPhase: resources
      - path: Tests/fixtures/private_video/synthetic-private-video.mov
        buildPhase: resources
    dependencies:
      - package: SuwopShell
        product: SuwopShell
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.rabe1028.suwop.private-video.tests
  SuwopPrivateLiveMacHost:
    type: application
    platform: macOS
    deploymentTarget: '14.0'
    sources: [NativeAcceptance/PrivateLiveHost]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.rabe1028.suwop.private-live.host
    info:
      path: Generated/PrivateLiveMacHost-Info.plist
      properties:
        CFBundleDisplayName: Suwop Live Acceptance
        NSPrincipalClass: NSApplication
        LSUIElement: false
        NSHighResolutionCapable: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  SuwopPrivateLiveMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - path: App/ImmichLockedLiveNativeAccess.swift
      - path: App/ImmichLockedLiveLifecycle.swift
      - path: App/ImmichLockedLiveIO.swift
      - path: App/ImmichLockedLivePublication.swift
      - path: App/ImmichLockedLiveEffects.swift
      - path: App/ImmichLockedLiveDisplay.swift
      - path: App/ImmichLockedLiveSurface.swift
      - path: App/PrivateLivePlatformView.swift
      - path: App/PrivateLiveBinding.swift
      - path: App/PrivateLiveFiles.swift
      - path: App/PrivateLiveResourceFormat.swift
      - path: App/PrivateLivePreparation.swift
      - path: App/PrivateLivePhotoKitRequest.swift
      - path: App/PrivateLivePreparedRegistry.swift
      - path: App/PrivateMediaAcquisition.swift
      - path: App/PrivateMediaConsumerRegistry.swift
      - path: App/PrivateMediaAllocationTypes.swift
      - path: App/PrivateMediaAllocationLedger.swift
      - path: App/PrivateVideoAcquisition.swift
      - path: App/PrivateVideoBinding.swift
      - path: App/PrivateVideoAllocation.swift
      - path: App/PrivateVideoFiles.swift
      - path: App/PrivateVideoNamespace.swift
      - path: App/PrivateVideoVolume.swift
      - path: App/PrivateVideoDownload.swift
      - path: App/PrivateVideoResponse.swift
      - path: App/NativeSubmissionGate.swift
      - path: App/MacScenePresentationAnchor.swift
      - path: App/NativeSceneAnchorChanges.swift
      - path: VRT/Host/PrivateVideoHTTPServer.swift
      - path: VRT/Host/ImmichVisibilityFixtureServer.swift
      - path: VRT/Host/ImmichVisibilityFixtureData.swift
      - path: VRT/Host/ImmichLockedFixtureData.swift
      - path: VRT/Host/PrivateLiveRenderedMotion.swift
      - path: NativeAcceptance/PrivateLiveTests
      - path: Tests/fixtures/native_live_motion/media/synthetic-still.jpg
        buildPhase: resources
      - path: Tests/fixtures/native_live_motion/media/synthetic-motion.mov
        buildPhase: resources
    dependencies:
      - target: SuwopPrivateLiveMacHost
      - package: SuwopShell
        product: SuwopShell
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: ImageIO.framework
    settings:
      base:
        # XcodeGen resolves this name into the unit bundle's TestTargetID.
        TEST_TARGET_NAME: SuwopPrivateLiveMacHost
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/SuwopPrivateLiveMacHost.app/Contents/MacOS/SuwopPrivateLiveMacHost'
        BUNDLE_LOADER: '$(TEST_HOST)'
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.rabe1028.suwop.private-live.tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) SUWOP_VRT'
  SuwopPrivateLiveUIProbeHost:
    type: application
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - path: App/ImmichLockedLiveNativeAccess.swift
      - path: App/ImmichLockedLiveLifecycle.swift
      - path: App/ImmichLockedLiveIO.swift
      - path: App/ImmichLockedLivePublication.swift
      - path: App/ImmichLockedLiveEffects.swift
      - path: App/ImmichLockedLiveDisplay.swift
      - path: App/ImmichLockedLiveSurface.swift
      - path: App/PrivateLivePlatformView.swift
      - path: App/PrivateLiveBinding.swift
      - path: App/PrivateLiveFiles.swift
      - path: App/PrivateLiveResourceFormat.swift
      - path: App/PrivateLivePreparation.swift
      - path: App/PrivateLivePhotoKitRequest.swift
      - path: App/PrivateLivePreparedRegistry.swift
      - path: App/PrivateMediaAcquisition.swift
      - path: App/PrivateMediaConsumerRegistry.swift
      - path: App/PrivateMediaAllocationTypes.swift
      - path: App/PrivateMediaAllocationLedger.swift
      - path: App/PrivateVideoAcquisition.swift
      - path: App/PrivateVideoBinding.swift
      - path: App/PrivateVideoAllocation.swift
      - path: App/PrivateVideoFiles.swift
      - path: App/PrivateVideoNamespace.swift
      - path: App/PrivateVideoVolume.swift
      - path: App/PrivateVideoDownload.swift
      - path: App/PrivateVideoResponse.swift
      - path: App/NativeSubmissionGate.swift
      - path: App/MacScenePresentationAnchor.swift
      - path: App/NativeSceneAnchorChanges.swift
      - path: VRT/Host/PrivateVideoHTTPServer.swift
      - path: VRT/Host/ImmichVisibilityFixtureServer.swift
      - path: VRT/Host/ImmichVisibilityFixtureData.swift
      - path: VRT/Host/ImmichLockedFixtureData.swift
      - path: VRT/Host/PrivateLiveRenderedMotion.swift
      - path: NativeAcceptance/PrivateLiveTests/PrivateLiveNativeFixture.swift
      - path: NativeAcceptance/PrivateLiveTests/PrivateLiveTestWindow.swift
      - path: NativeAcceptance/PrivateLiveUIProbeHost
      - path: NativeAcceptance/PrivateLiveUIProbeShared
      - path: Tests/fixtures/native_live_motion/media/synthetic-still.jpg
        buildPhase: resources
      - path: Tests/fixtures/native_live_motion/media/synthetic-motion.mov
        buildPhase: resources
    dependencies:
      - package: SuwopShell
        product: SuwopShell
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: ImageIO.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.rabe1028.suwop.private-live.ui-probe.host
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) SUWOP_VRT SUWOP_LIVE_EXTERNAL_ACCEPTANCE'
    info:
      path: Generated/PrivateLiveUIProbeHost-Info.plist
      properties:
        CFBundleDisplayName: Suwop Independent Live Probe
        NSPrincipalClass: NSApplication
        LSUIElement: false
        NSHighResolutionCapable: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  SuwopPrivateLiveUIProbeTests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - path: NativeAcceptance/PrivateLiveUIProbeTests
      - path: NativeAcceptance/PrivateLiveUIProbeShared
      - path: VRT/Host/PrivateLiveRenderedMotion.swift
    dependencies:
      - target: SuwopPrivateLiveUIProbeHost
      - target: SuwopPrivateLiveMacHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.rabe1028.suwop.private-live.ui-probe.tests
        TEST_TARGET_NAME: SuwopPrivateLiveUIProbeHost
schemes:
  SuwopiOS:
    build:
      targets:
        SuwopiOS: all
  SuwopmacOS:
    build:
      targets:
        SuwopmacOS: all
  SuwopVRT:
    build:
      targets:
        SuwopVRTHost: all
        SuwopVRT: [test]
        SuwopVRTUI: [test]
    test:
      gatherCoverageData: false
      targets: [SuwopVRT, SuwopVRTUI]
      environmentVariables:
        SUWOP_VRT_RECORD: '$(SUWOP_VRT_RECORD)'
        SUWOP_VRT_BASELINES: '$(SUWOP_VRT_BASELINES)'
        SUWOP_VRT_ARTIFACTS: '$(SUWOP_VRT_ARTIFACTS)'
        TZ: UTC
  SuwopPhotoKit:
    build:
      targets:
        SuwopPhotoKitHost: all
        SuwopPhotoKitTests: [test]
    test:
      gatherCoverageData: false
      targets: [SuwopPhotoKitTests]
  SuwopAmazonMac:
    build:
      targets:
        SuwopmacOS: all
        SuwopAmazonMacTests: [test]
    test:
      gatherCoverageData: false
      targets: [SuwopAmazonMacTests]
  SuwopSharing:
    build:
      targets:
        SuwopSharingTests: [test]
    test:
      gatherCoverageData: false
      targets: [SuwopSharingTests]
  SuwopPrivateVideoMac:
    build:
      targets:
        SuwopPrivateVideoMacTests: [test]
    test:
      gatherCoverageData: false
      targets: [SuwopPrivateVideoMacTests]
  SuwopPrivateLiveMac:
    build:
      targets:
        SuwopPrivateLiveMacHost: all
        SuwopPrivateLiveMacTests: [test]
    test:
      gatherCoverageData: false
      targets: [SuwopPrivateLiveMacTests]
  SuwopPrivateLiveUIProbe:
    build:
      targets:
        SuwopPrivateLiveUIProbeHost: all
        SuwopPrivateLiveUIProbeTests: [test]
    test:
      gatherCoverageData: false
      targets: [SuwopPrivateLiveUIProbeTests]
