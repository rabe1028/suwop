name: Suwop
options:
  minimumXcodeGenVersion: 2.38.0
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  SuwopShell:
    path: .
targets:
  SuwopiOS:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources: [App]
    dependencies:
      - package: SuwopShell
        product: SuwopShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.rabe1028.suwop.ios
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: Suwop
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSPhotoLibraryUsageDescription: 写真を閲覧・整理し、Apple Photos と Immich の原本を照合・コピー・移動します。
        NSPhotoLibraryAddUsageDescription: Immich の写真を Apple Photos に保存します。
        NSLocalNetworkUsageDescription: 自宅ネットワーク上の Immich サーバーに接続します。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  SuwopmacOS:
    type: application
    platform: macOS
    deploymentTarget: '14.0'
    sources: [App]
    dependencies:
      - package: SuwopShell
        product: SuwopShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.rabe1028.suwop.mac
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_ENTITLEMENTS: Config/Suwop.entitlements
    info:
      path: Generated/macOS-Info.plist
      properties:
        CFBundleDisplayName: Suwop
        LSApplicationCategoryType: public.app-category.photography
        NSPhotoLibraryUsageDescription: 写真を閲覧・整理し、Apple Photos と Immich の原本を照合・コピー・移動します。
        NSPhotoLibraryAddUsageDescription: Immich の写真を Apple Photos に保存します。
        NSLocalNetworkUsageDescription: 自宅ネットワーク上の Immich サーバーに接続します。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  SuwopVRTHost:
    type: application
    platform: iOS
    deploymentTarget: '26.4'
    sources:
      - path: App
        excludes: [SuwopApp.swift]
      - path: VRT/Host
    dependencies:
      - package: SuwopShell
        product: SuwopShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.rabe1028.suwop.vrt
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) SUWOP_VRT'
        TARGETED_DEVICE_FAMILY: '1'
    info:
      path: Generated/VRT-Info.plist
      properties:
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja]
        UILaunchScreen: {}
  SuwopVRT:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '26.4'
    sources: [VRT/Tests]
    dependencies:
      - target: SuwopVRTHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.rabe1028.suwop.vrt.tests
        SWIFT_OPTIMIZATION_LEVEL: '-O'
  SuwopVRTUI:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '26.4'
    sources: [VRT/UITests]
    dependencies:
      - target: SuwopVRTHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.rabe1028.suwop.vrt.ui
        TEST_TARGET_NAME: SuwopVRTHost
schemes:
  SuwopiOS:
    build:
      targets:
        SuwopiOS: all
  SuwopmacOS:
    build:
      targets:
        SuwopmacOS: all
  SuwopVRT:
    build:
      targets:
        SuwopVRTHost: all
        SuwopVRT: [test]
        SuwopVRTUI: [test]
    test:
      gatherCoverageData: false
      targets: [SuwopVRT, SuwopVRTUI]
      environmentVariables:
        SUWOP_VRT_RECORD: '$(SUWOP_VRT_RECORD)'
        SUWOP_VRT_BASELINES: '$(SUWOP_VRT_BASELINES)'
        SUWOP_VRT_ARTIFACTS: '$(SUWOP_VRT_ARTIFACTS)'
        TZ: UTC
